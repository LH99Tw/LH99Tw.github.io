<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar Profile Preview</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/spoqa-han-sans@2.1.1/css/SpoqaHanSansNeo.min.css" />
  <style>
    :root {
      --bg: #f6f6f8;
      --sidebar-bg: #f4f4f6;
      --surface: #ffffff;
      --line: rgba(0, 0, 0, 0.08);
      --text-1: #1d1d1f;
      --text-2: #6e6e73;
      --text-3: #a6a6ad;
      --accent: #534340;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Spoqa Han Sans Neo", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text-1);
      display: grid;
      grid-template-columns: 248px 1fr;
    }

    .sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--line);
      padding: 18px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .profile {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
    }

    .profile__image-wrap {
      width: 100%;
      aspect-ratio: 9 / 12;
      border-radius: 12px;
      overflow: hidden;
      background: #dedee3;
      margin-bottom: 10px;
    }

    .profile__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile__name {
      font-size: 0.97rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile__intro {
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--text-2);
      margin-bottom: 10px;
    }

    .profile__stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .profile__stats-label {
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 700;
    }

    .profile__stats-value {
      font-size: 0.82rem;
      color: var(--accent);
      font-weight: 700;
    }

    .nav {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 8px;
    }

    .nav__link {
      display: block;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--text-1);
      text-decoration: none;
      margin-bottom: 2px;
    }

    .nav__link:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .nav__link.active {
      background: rgba(83, 67, 64, 0.12);
      color: var(--accent);
      font-weight: 700;
    }

    .nav__title {
      margin: 8px 8px 6px;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 700;
    }

    .nav__sub {
      list-style: none;
      padding: 0 6px;
    }

    .nav__sub a {
      display: block;
      text-decoration: none;
      font-size: 0.76rem;
      color: var(--text-2);
      padding: 5px 7px;
      border-radius: 7px;
    }

    .nav__sub a:hover {
      background: rgba(0, 0, 0, 0.04);
      color: var(--accent);
    }

    .main {
      display: grid;
      place-items: center;
      padding: 36px;
      color: var(--text-3);
    }

    .main__box {
      width: min(860px, 100%);
      height: min(460px, 72vh);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 0.96rem;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <section class="profile">
      <div class="profile__image-wrap">
        <img class="profile__image" src="./assets/images/profile.jpg" alt="이주한 프로필 이미지" />
      </div>
      <h1 class="profile__name">이주한</h1>
      <p class="profile__intro">AI, 금융, 개발 기록을 차분하게 정리하는 개인 기술 블로그</p>
      <div class="profile__stats">
        <span class="profile__stats-label">Posting</span>
        <span class="profile__stats-value">11</span>
      </div>
    </section>

    <nav class="nav">
      <a class="nav__link active" href="#">홈</a>
      <div class="nav__title">Category</div>
      <ul class="nav__sub">
        <li><a href="#">프로그래밍</a></li>
        <li><a href="#">금융</a></li>
        <li><a href="#">일상</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main">
    <div class="main__box">메인 콘텐츠 영역 (사이드바 프리뷰)</div>
  </main>
</body>
</html>
