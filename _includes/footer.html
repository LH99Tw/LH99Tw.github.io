<footer class="site-footer">
  <div class="site-footer__inner">
    <small>© {{ site.time | date: "%Y" }} {{ site.title }}.</small>
    <div class="site-footer__links">
      <a class="site-footer__icon-link" href="https://www.threads.com/@hhannn001" target="_blank" rel="noopener" aria-label="Threads">
        <img src="{{ '/assets/images/mainpage/threads.png' | relative_url }}" alt="" aria-hidden="true" />
      </a>
      <a class="site-footer__icon-link" href="https://github.com/{{ site.github_username | default: 'LH99Tw' }}" target="_blank" rel="noopener" aria-label="GitHub">
        <img src="{{ '/assets/images/mainpage/github.png' | relative_url }}" alt="" aria-hidden="true" />
      </a>
    </div>
  </div>
</footer>
