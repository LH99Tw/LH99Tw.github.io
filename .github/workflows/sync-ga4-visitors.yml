name: Sync GA4 Visitors

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          token_format: "access_token"
          access_token_scopes: "https://www.googleapis.com/auth/analytics.readonly"

      - name: Sync GA4 Visitor Data
        env:
          GA4_ACCESS_TOKEN: "${{ steps.auth.outputs.access_token }}"
          GA4_PROPERTY_ID: "${{ secrets.GA4_PROPERTY_ID }}"
          GA4_TIMEZONE: "Asia/Seoul"
          GA4_FIRST_DATE: "2024-01-01"
          GA4_OUTPUT_FILE: "_data/ga4_visitors.yml"
        run: node ./scripts/sync-ga4-visitors.mjs

      - name: Commit And Push
        run: |
          if git diff --quiet -- _data/ga4_visitors.yml; then
            echo "No GA4 visitor changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/ga4_visitors.yml
          git commit -m "chore: sync GA4 visitors data"
          git push
