<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>
  <meta
    name="description"
    content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | replace: '  ', ' ' }}"
  />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% seo %}
</head>
