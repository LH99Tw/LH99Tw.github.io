<section class="search-section" aria-label="검색 및 소셜 링크">
  <div class="search-wrap">
    <form action="{{ '/search/' | relative_url }}" method="get" role="search">
      <label class="visually-hidden" for="global-search-input">검색</label>
      <input
        id="global-search-input"
        class="search-bar"
        type="search"
        name="q"
        placeholder="게시물을 검색하세요…"
        data-search-endpoint="{{ '/search.json' | relative_url }}"
        autocomplete="off"
      />
      <button class="search-btn" type="submit" aria-label="검색">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="9" r="5"></circle>
          <path d="m16 16-2.5-2.5" stroke-linecap="round"></path>
        </svg>
      </button>
    </form>
  </div>

  <div class="social-row">
    <a class="social-item" href="https://github.com/{{ site.github_username | default: 'LH99Tw' }}" target="_blank" rel="noopener">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.38 7.86 10.9.58.1.8-.25.8-.56 0-.28-.01-1.03-.02-2.03-3.2.69-3.87-1.54-3.87-1.54-.53-1.34-1.3-1.7-1.3-1.7-1.07-.73.08-.71.08-.71 1.18.08 1.8 1.22 1.8 1.22 1.05 1.8 2.76 1.28 3.43.98.1-.76.41-1.28.74-1.58-2.55-.29-5.24-1.27-5.24-5.66 0-1.25.45-2.27 1.19-3.07-.12-.29-.52-1.45.11-3.02 0 0 .97-.31 3.18 1.17.92-.26 1.9-.39 2.88-.39.98 0 1.96.13 2.88.39 2.21-1.48 3.18-1.17 3.18-1.17.63 1.57.23 2.73.11 3.02.74.8 1.19 1.82 1.19 3.07 0 4.4-2.7 5.37-5.26 5.65.42.36.8 1.08.8 2.18 0 1.57-.02 2.83-.02 3.21 0 .31.21.67.81.56C20.22 21.38 23.5 17.08 23.5 12 23.5 5.65 18.35.5 12 .5Z"></path>
        </svg>
      </div>
      <span class="social-item__label">GitHub</span>
    </a>

    <a class="social-item" href="https://www.threads.com/@hhannn001" target="_blank" rel="noopener">
      <div class="social-item__icon">
        <img src="{{ '/assets/images/icon-threads.svg' | relative_url }}" alt="" aria-hidden="true" />
      </div>
      <span class="social-item__label">Threads</span>
    </a>

    <a class="social-item" href="https://www.instagram.com/" target="_blank" rel="noopener">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <span class="social-item__label">Instagram</span>
    </a>

    <a class="social-item" href="https://www.linkedin.com/in/juhan-lee-a45441354" target="_blank" rel="noopener">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452z"></path>
        </svg>
      </div>
      <span class="social-item__label">LinkedIn</span>
    </a>

    <a class="social-item" href="mailto:{{ site.author.email | default: 'contact@example.com' }}">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"></rect>
          <path d="m2 7 10 7 10-7"></path>
        </svg>
      </div>
      <span class="social-item__label">Email</span>
    </a>

    <a class="social-item" href="{{ '/atom.xml' | relative_url }}">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.18 15.64a2.18 2.18 0 012.18 2.18C8.36 19.01 7.38 20 6.18 20 4.98 20 4 19.01 4 17.82a2.18 2.18 0 012.18-2.18M4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44m0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"></path>
        </svg>
      </div>
      <span class="social-item__label">RSS</span>
    </a>

    <a class="social-item" href="{{ '/categories/journal/' | relative_url }}">
      <div class="social-item__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
        </svg>
      </div>
      <span class="social-item__label">About</span>
    </a>
  </div>
</section>
