<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% assign favicon_path = '/assets/images/mainpage/github.png' %}
  <link rel="icon" href="{{ favicon_path | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ favicon_path | relative_url }}" />
  <meta name="theme-color" content="#534340" />
  <link
    rel="preload"
    href="{{ '/assets/fonts/spoqa/JejuMyeongjo.ttf' | relative_url }}"
    as="font"
    type="font/ttf"
    crossorigin
  />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  {% feed_meta %}
  {% seo %}
  {% if page.robots %}
    <meta name="robots" content="{{ page.robots }}" />
  {% endif %}
  {% if site.ga4.measurement_id %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4.measurement_id }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", "{{ site.ga4.measurement_id }}", { send_page_view: false });

      function trackPageView() {
        gtag("event", "page_view", {
          page_title: document.title || "",
          page_location: window.location.href,
          page_path: window.location.pathname + window.location.search
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", trackPageView, { once: true });
      } else {
        trackPageView();
      }

      window.addEventListener("pageshow", function(event) {
        if (event.persisted) {
          trackPageView();
        }
      });
    </script>
  {% endif %}
</head>
