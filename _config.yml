title: "LH99Tw Dev Blog"
description: "Jekyll로 만드는 GitHub Pages 블로그 기록"
url: "https://LH99Tw.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

author:
  name: "이주한"
  email: "contact@example.com"
github_username: "LH99Tw"
twitter_username: "LH99Tw"
linkedin_username: "LH99Tw"

profile:
  name: "이주한"
  bio: "기록하며 성장하는 개발자입니다."
  image: "/assets/images/profile-placeholder.svg"

permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LAW.md
  - vendor/
  - .bundle/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "이주한"
      image: "/assets/images/social-card.png"
      seo:
        type: "article"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      image: "/assets/images/social-card.png"
      seo:
        type: "webpage"
  - scope:
      path: "categories"
      type: "pages"
    values:
      layout: category
      image: "/assets/images/social-card.png"
      seo:
        type: "website"

social:
  name: "이주한"
  links:
    - "https://github.com/LH99Tw"

logo: /assets/images/favicon.svg
feed:
  path: atom.xml
