title: "이주한 기술 블로그"
description: "AI와 금융 인사이트를 기록하는 개발 블로그"
url: "https://lh99tw.github.io"
baseurl: ""
lang: ko
timezone: Asia/Seoul

author:
  name: "이주한"
  email: "contact@example.com"
github_username: "LH99Tw"
threads_username: "hhannn001"
ga4:
  measurement_id: "G-5L16WJXERM"
  stream_id: "14296505656"
  timezone: "Asia/Seoul"
  first_date: "2024-01-01"

profile:
  name: "이주한"
  bio: "기록하며 성장하는 개발자입니다."

permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - LAW.md
  - vendor/
  - vendor/bundle/
  - .bundle/
  - .github/
  - .jekyll-cache/
  - .jekyll-metadata
  - .sass-cache/
  - _site/
  - node_modules/
  - node_modules/**
  - editor/
  - editor/**
  - scripts/
  - chachayelmo.github.io-main/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "이주한"
      seo:
        type: "article"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
      seo:
        type: "webpage"
  - scope:
      path: "categories"
      type: "pages"
    values:
      layout: category
      seo:
        type: "webpage"
  - scope:
      path: "search"
      type: "pages"
    values:
      sitemap: false
      robots: "noindex, follow"
  - scope:
      path: "document"
      type: "pages"
    values:
      sitemap: false
      robots: "noindex, nofollow"
  - scope:
      path: "editor"
      type: "pages"
    values:
      sitemap: false
      robots: "noindex, nofollow"

social:
  name: "이주한"
  links:
    - "https://github.com/LH99Tw"

logo: "/assets/images/mainpage/github.png"

feed:
  path: atom.xml
